<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="t d"><title id="t">How a battery delivers energy</title><desc id="d">Electrons travel through the external circuit to power a device, while ions move within the cell through the electrolyte.</desc><rect width="920" height="240" rx="20" fill="#f3f7fc"/><g font-family="Arial,sans-serif" font-size="19" fill="#17324d" text-anchor="middle"><rect x="45" y="63" width="185" height="110" rx="15" fill="#d9e6f2" stroke="#7092b0" stroke-width="2"/><text x="137" y="103" font-weight="bold">Negative</text><text x="137" y="129">electrode</text><rect x="243" y="63" width="200" height="110" rx="15" fill="#e0f2e9" stroke="#69a78b" stroke-width="2"/><text x="343" y="103" font-weight="bold">Electrolyte</text><text x="343" y="129" font-size="16">Ion movement ↔</text><rect x="455" y="63" width="185" height="110" rx="15" fill="#d9e6f2" stroke="#7092b0" stroke-width="2"/><text x="547" y="103" font-weight="bold">Positive</text><text x="547" y="129">electrode</text><rect x="739" y="63" width="150" height="110" rx="15" fill="#ffe8b8" stroke="#d6a65d" stroke-width="2"/><text x="813" y="112" font-weight="bold">Device</text><path d="M137 58 V26 H813 V58" fill="none" stroke="#236a9b" stroke-width="4"/><path d="m805 46 8 12 8-12" fill="none" stroke="#236a9b" stroke-width="4"/><text x="470" y="19" font-size="15">Electron flow through external circuit (illustrative)</text><path d="M640 119 H735" stroke="#236a9b" stroke-width="4"/><path d="m724 111 11 8-11 8" fill="none" stroke="#236a9b" stroke-width="4"/><text x="460" y="213" font-size="15">Simplified discharge schematic; actual ion species and directions depend on chemistry</text></g></svg>