<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Schematic pion exchange between proton and neutron"><title>Schematic pion exchange between proton and neutron</title><defs><radialGradient id="bg"><stop stop-color="#172d49"/><stop offset="1" stop-color="#081321"/></radialGradient><radialGradient id="p"><stop stop-color="#ffaaa0"/><stop offset="1" stop-color="#d65b6b"/></radialGradient><radialGradient id="n"><stop stop-color="#bce4ff"/><stop offset="1" stop-color="#4487cc"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><g font-family="Arial" text-anchor="middle" fill="#eaf5ff"><text x="600" y="88" font-size="34">Residual nuclear interaction</text><text x="600" y="140" font-size="22" fill="#c4e0f5">Pion exchange is one part of the effective picture</text></g><circle cx="305" cy="343" r="106" fill="url(#p)" stroke="#f7fbff" stroke-opacity=".4" stroke-width="3"/><text x="305" y="359" fill="#081321" text-anchor="middle" font-size="29" font-family="Arial" font-weight="bold">Proton</text><circle cx="895" cy="343" r="106" fill="url(#n)" stroke="#f7fbff" stroke-opacity=".4" stroke-width="3"/><text x="895" y="359" fill="#081321" text-anchor="middle" font-size="29" font-family="Arial" font-weight="bold">Neutron</text><path d="M416 343 C500 255 540 430 600 343 S710 260 784 343" stroke="#ffd98a" stroke-width="8" stroke-dasharray="13 10" fill="none"/><circle cx="600" cy="343" r="25" fill="#ffd98a"/><text x="600" y="422" font-size="24" text-anchor="middle" fill="#f8dfb0" font-family="Arial">virtual pion</text><text x="600" y="546" text-anchor="middle" font-size="21" fill="#adc5db" font-family="Arial">Schematic only — not a literal particle trajectory</text></svg>